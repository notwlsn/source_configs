// radar
cl_radar_always_centered "0"
cl_radar_scale "0.3"
cl_hud_radar_scale "1.15"
cl_radar_icon_scale_min "0.75"
cl_radar_rotate "0"
cl_radar_square_with_scoreboard "1"

// viewmodel
viewmodel_fov 70.000000
viewmodel_presetpos 2
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5

// left hand
cl_prefer_lefthanded false

// crosshair
// bind "F1" "cl_crosshaircolor 1"
// bind "F2" "cl_crosshaircolor 2"
// bind "F3" "cl_crosshaircolor 3"
// bind "F4" "cl_crosshaircolor 4"

// game binds
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
bind "space" "+jump"

// custom map binds
bind "-" "disconnect"
// bind "kp_del" "quit"

bind "x" "noclip"
bind "j" "sv_rethrow_last_grenade"
bind "n" "cl_sim_grenade_trajectory"
bind "k" "mp_buytime 60000; mp_buy_anywhere 1; sv_infinite_ammo 1; sv_cheats 1; mp_drop_knife_enable true"
alias "+clearsmoke" "host_timescale 18"; alias "-clearsmoke" "host_timescale 1"; bind "o" "+clearsmoke"

// custom workshop maps
alias recoil_master "map_workshop 3100869952 recoil_master"

// spectator binds
// bind "" "cl_drawhud 0" // → Removes the entire HUD, good for cinematic gameplay
bind "p" demo_togglepause"
bind "[" "spec_show_xray 0"
bind "]" "spec_show_xray 1"

// player select
bind "6" "spec_player 6"
bind "7" "spec_player 7"
bind "8" "spec_player 8"
bind "9" "spec_player 9"
bind "0" "spec_player 10"

// buy binds
bind "F1" "buy ak47; buy vesthelm; buy flashbang; buy hegrenade; buy smokegrenade; buy deagle;"
bind "F2" "buy vesthelm; buy incgrenade; buy m4a1_silencer; buy usp_silencer; buy flashbang; buy hegrenade; buy smokegrenade; buy defuser;"
bind "F3" "buy vesthelm; buy galilar; buy glock; buy smokegrenade;"
bind "F4" "buy vesthelm; buy smokegrenade; buy mp9; buy usp_silencer; buy defuser;"

// funni aliases
alias drop_knife "sv_cheats 1; mp_drop_knife_enable 1; slot3; drop; delay 0.1 change_knife"
alias change_knife "ent_fire weapon_knife ChangeSubclass 507"
alias go "bot_kick all; sv_grenade_trajectory_prac_pipreview 1; sv_infinite_ammo 1; mp_warmuptime 999999; mp_warmup_pausetimer 1; mp_startmoney 65535; mp_maxmoney 65535; mp_buy_anywhere 1"

